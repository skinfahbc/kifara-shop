<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>پنل مدیریت | کیف‌آرا</title>
<meta name="theme-color" content="#0e0c0a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap">
<style>html{color-scheme:dark}body{margin:0}
/* Layout: mobile-first RTL storefront, floating glass header + liquid-notch bottom nav over an ambient gold/haze backdrop */
@property --nr{syntax:'<length>';inherits:true;initial-value:0px}
@property --nx{syntax:'<length>';inherits:true;initial-value:50px}
:root{
  --accent:#e0b374; --accent2:#f4dcae; --on-accent:#2a1c08;
  --bgd:#0e0c0a; --bgl:#efe7d9;
  --bg:var(--bgd); --bg2:#1b1712;
  --fg:#f8f0e1; --muted:rgba(248,240,225,.68); --faint:rgba(248,240,225,.4);
  --ga:.12; --gk:1; --blur:22px; --r:24px;
  --gb:rgba(255,255,255,.2); --shadow:0 18px 44px rgba(0,0,0,.42);
  --sheet:rgba(24,20,15,.82); --seen:rgba(255,255,255,.28); --field:rgba(255,255,255,.08);
  --blob1:rgba(224,179,116,.34); --blob2:rgba(111,138,163,.38); --blob3:rgba(160,96,60,.22);
  --ink:var(--accent2);--ok:#6fd3a0; --bad:#f0746b; --font:'Vazirmatn',system-ui,sans-serif; --disp:'Lalezar','Vazirmatn',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--ink:color-mix(in srgb,var(--accent) 50%,#2a1c08);--bg:var(--bgl);--bg2:#e4d9c6;--fg:#2b2217;--muted:rgba(43,34,23,.7);--faint:rgba(43,34,23,.42);--gk:4.2;--gb:rgba(255,255,255,.75);--shadow:0 14px 34px rgba(90,60,20,.16);--sheet:rgba(255,251,244,.86);--seen:rgba(43,34,23,.22);--field:rgba(43,34,23,.06);--blob1:rgba(224,179,116,.5);--blob2:rgba(140,170,200,.5);--blob3:rgba(230,160,130,.3);color-scheme:light}}
:root[data-theme="light"]{--ink:color-mix(in srgb,var(--accent) 50%,#2a1c08);--bg:var(--bgl);--bg2:#e4d9c6;--fg:#2b2217;--muted:rgba(43,34,23,.7);--faint:rgba(43,34,23,.42);--gk:4.2;--gb:rgba(255,255,255,.75);--shadow:0 14px 34px rgba(90,60,20,.16);--sheet:rgba(255,251,244,.86);--seen:rgba(43,34,23,.22);--field:rgba(43,34,23,.06);--blob1:rgba(224,179,116,.5);--blob2:rgba(140,170,200,.5);--blob3:rgba(230,160,130,.3);color-scheme:light}
:root[data-theme="dark"]{--ink:var(--accent2);--bg:var(--bgd);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.75;direction:rtl;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient i{position:absolute;border-radius:50%;filter:blur(70px);animation:drift 26s ease-in-out infinite alternate}
.ambient i:nth-child(1){width:70vmax;height:70vmax;background:var(--blob1);top:-20vmax;right:-18vmax}
.ambient i:nth-child(2){width:60vmax;height:60vmax;background:var(--blob2);top:10vmax;left:-24vmax;animation-delay:-8s}
.ambient i:nth-child(3){width:50vmax;height:50vmax;background:var(--blob3);bottom:-20vmax;right:-10vmax;animation-delay:-15s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}

.glass{background:linear-gradient(145deg,rgba(255,255,255,calc(var(--ga)*var(--gk)*1.5)),rgba(255,255,255,calc(var(--ga)*var(--gk)*.55)));
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.5);backdrop-filter:blur(var(--blur)) saturate(1.5);
  border:1px solid var(--gb);border-radius:var(--r);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.22)}
.app{width:100%;max-width:540px;margin:0 auto;padding-top:calc(84px + env(safe-area-inset-top,0px) * 0);padding-bottom:150px;display:flex;flex-direction:column;gap:26px}
.app>*{min-width:0}

/* header */
.hd{position:fixed;top:env(safe-area-inset-top,0px);left:50%;transform:translateX(-50%);width:min(100%,540px);z-index:20;
  padding:10px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.hd-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:999px}
.hd-grp{display:flex;gap:8px;align-items:center}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,calc(var(--ga)*var(--gk)*1.2));border:1px solid var(--gb);transition:transform .2s,background .2s}
.ib:active{transform:scale(.92)}
.ib .dot{position:absolute}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:25px;line-height:1;padding-inline:6px;color:var(--accent2);text-decoration:none;white-space:nowrap;max-width:50%}
.logo img{height:38px;width:auto;max-width:150px;object-fit:contain}
.logo svg{color:var(--accent)}

/* hero */
.hero{position:relative;height:clamp(330px,88vw,440px);border-radius:32px;overflow:hidden;touch-action:pan-y;cursor:pointer;border:1px solid var(--gb);box-shadow:var(--shadow)}
.hero .sl{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
.hero .sl.on{opacity:1;pointer-events:auto}
.hero .sl img{width:100%;height:100%;object-fit:cover}
.hero .sl.on img{animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.13) translate(-1.5%,-1%)}}
.hero .sl::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,8,6,.78) 0%,rgba(10,8,6,.15) 55%,rgba(10,8,6,.25) 100%)}
.hero .tx{position:absolute;z-index:2;inset:auto 18px 52px 18px;color:#fff8ea;display:flex;flex-direction:column;gap:6px;align-items:flex-start;transform:translateY(12px);opacity:0;transition:.7s .25s}
.hero .sl.on .tx{transform:none;opacity:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hero h2{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(28px,8vw,38px);line-height:1.25;text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.hero p{margin:0;font-size:13.5px;opacity:.88;max-width:26ch}
.btn-g{margin-top:6px;display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:600;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on-accent);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.dots{position:absolute;z-index:3;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:7px}
.dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.45);transition:.4s}
.dots i.on{width:26px;background:var(--accent2)}

/* stories */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 12px}
.sec-h h3{margin:0;font-size:19px;font-weight:800;text-wrap:balance}
.sec-h a,.sec-h button{font-size:13px;color:var(--accent)}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{flex:0 0 78px;display:flex;flex-direction:column;align-items:center;gap:7px;scroll-snap-align:start;font-size:12px;min-width:0}
.ring{width:78px;height:78px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,var(--accent2),var(--accent),#e48f6a,var(--accent2));transition:.4s;position:relative}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg);background:var(--bg2)}
.ring.seen{background:var(--seen)}
.ring.seen img{filter:grayscale(.55) brightness(.85)}
.ring .pl{position:absolute;bottom:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border:2px solid var(--bg)}
.st span{max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.hint{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:999px;font-size:13px;color:var(--muted)}
.hint .nb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,calc(var(--ga)*var(--gk)*1.4));flex:none}
.hint .bar{flex:0 0 82px;height:4px;border-radius:9px;background:var(--seen);overflow:hidden}
.hint .bar b{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:9px;transition:width .5s}

/* intro */
.intro{padding:26px 22px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.intro .k{color:var(--accent);font-size:13.5px;font-weight:700}
.intro h3{margin:0;font-family:var(--disp);font-weight:400;font-size:30px;line-height:1.3;text-wrap:balance}
.intro p{margin:0;color:var(--muted)}
.intro .star{position:absolute;left:18px;top:16px;color:var(--accent);opacity:.9}

/* products */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pc{overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .25s,box-shadow .25s;min-width:0}
.pc:hover{transform:translateY(-3px)}
.pc .bd{background:linear-gradient(90deg,var(--accent),var(--accent2));color:var(--on-accent);font-size:12px;font-weight:700;text-align:center;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .im{position:relative;aspect-ratio:1/1.08;overflow:hidden;background:var(--bg2)}
.pc .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.pc:hover .im img{transform:scale(1.06)}
.off{position:absolute;top:10px;right:10px;background:rgba(220,70,60,.92);color:#fff;font-size:12px;font-weight:700;padding:1px 10px;border-radius:99px}
.rb{position:absolute;bottom:10px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.rb.add{left:10px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on-accent);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.rb.fav{right:10px;background:rgba(255,255,255,.82);color:#555}
.rb.fav.on{color:#e0453f}.rb.fav.on svg{fill:currentColor}
.pc .in{padding:10px 12px 14px;display:flex;flex-direction:column;gap:2px}
.pc h4{margin:0;font-size:14px;font-weight:600;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3.2em}
.old{font-size:12px;color:var(--faint);text-decoration:line-through;min-height:1.5em}
.price{font-weight:800;color:var(--accent2);font-size:15px;font-variant-numeric:tabular-nums}
.price small{font-weight:400;font-size:12px;color:var(--muted)}
.sw-row{display:flex;gap:4px;margin-top:2px}.sw-row i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.4)}

/* features */
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fc{padding:18px 16px;display:flex;flex-direction:column;gap:6px}
.fc .fi{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on-accent);margin-bottom:6px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.fc b{font-size:16px}.fc span{font-size:13px;color:var(--muted)}
.night{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;width:100%;text-align:right}
.night .ni{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,calc(var(--ga)*var(--gk)*1.4));color:var(--accent)}
.night .nt{flex:1}.night .nt b{display:block}.night .nt small{color:var(--accent);font-size:12.5px}
.tg{width:58px;height:32px;border-radius:99px;background:var(--seen);position:relative;transition:.3s;flex:none}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);transition:.35s cubic-bezier(.34,1.56,.64,1)}
.tg.on{background:linear-gradient(135deg,var(--accent2),var(--accent))}.tg.on::after{transform:translateX(-26px)}

.about{padding:28px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.about h3{margin:0;font-family:var(--disp);font-weight:400;font-size:30px}
.about p{margin:0;color:var(--muted);max-width:34ch}
.soc{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.soc a{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,calc(var(--ga)*var(--gk)*1.4));border:1px solid var(--gb);transition:.25s;color:var(--accent2)}
.soc a:hover{transform:translateY(-4px) scale(1.06);background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on-accent)}
.links{display:flex;justify-content:space-between;gap:10px;width:100%;border-top:1px solid var(--gb);padding-top:14px;font-size:13.5px;color:var(--accent);flex-wrap:wrap}
.links a{text-decoration:none}
.copy{text-align:center;font-size:12px;color:var(--faint)}

/* bottom nav with liquid notch */
.nv{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,540px);z-index:20;padding:0 max(14px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px));pointer-events:none}
.nv-in{position:relative;height:70px;pointer-events:auto;--nr:0px;--nx:50px;transition:--nr .32s cubic-bezier(.34,1.5,.64,1)}
.nv-bar{position:absolute;inset:0;border-radius:30px;display:flex;align-items:flex-end;
  -webkit-mask-image:radial-gradient(circle at var(--nx) 4px,transparent calc(var(--nr) - .5px),#000 var(--nr));mask-image:radial-gradient(circle at var(--nx) 4px,transparent calc(var(--nr) - .5px),#000 var(--nr))}
.nv-b{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11.5px;position:relative;transition:color .3s,opacity .25s,transform .35s}
.nv-b.on{color:var(--accent2);font-weight:700;transform:translateY(9px)}
.nv-b.on svg{opacity:0}
.nv-b .cnt{position:absolute;top:10px;margin-right:-18px;min-width:18px;height:18px;border-radius:9px;background:#e0453f;color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;line-height:1}
.nv-bub{position:absolute;top:-26px;width:58px;height:58px;margin-right:0;border-radius:50%;background:linear-gradient(145deg,var(--accent2),var(--accent));color:var(--on-accent);display:grid;place-items:center;
  box-shadow:0 10px 26px rgba(0,0,0,.4),0 0 0 3px var(--bg),0 0 0 5.5px var(--accent);transition:transform .38s cubic-bezier(.34,1.7,.64,1),left .01s;pointer-events:none;z-index:2;transform:translateX(-50%) scale(1)}
.nv.sw .nv-bub{transform:translateX(-50%) scale(0);transition-duration:.15s}
.nv-lab{position:absolute;z-index:2;bottom:8px;font-size:11.5px;font-weight:700;color:var(--accent2);transform:translateX(50%);pointer-events:none;white-space:nowrap}
.nv-bub svg{width:26px;height:26px}

/* drawer */
.ov{position:fixed;inset:0;z-index:60;background:rgba(6,5,4,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;animation:fi .25s}
@keyframes fi{from{opacity:0}}
.ov.c{align-items:center;justify-content:center;padding:16px}
.ov.b{align-items:flex-end;justify-content:center}
.ov.s{justify-content:flex-start}
.dr{width:min(88vw,400px);height:100%;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--sheet);-webkit-backdrop-filter:blur(34px) saturate(1.6);backdrop-filter:blur(34px) saturate(1.6);border-inline-start:1px solid var(--gb);border-radius:0 0 0 0;display:flex;flex-direction:column;gap:16px;animation:slr .38s cubic-bezier(.2,.9,.3,1)}
@keyframes slr{from{transform:translateX(100%)}}
.ov.s{justify-content:flex-start}
.dr-ban{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:16/8.4;flex:none;color:#fff}
.dr-ban img{width:100%;height:100%;object-fit:cover}
.dr-ban::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.72),transparent 65%)}
.dr-ban .t{position:absolute;z-index:2;bottom:12px;right:16px;left:16px}
.dr-ban .t b{font-family:var(--disp);font-weight:400;font-size:26px;display:block;line-height:1.2}
.dr-ban .t span{font-size:13px;opacity:.85}
.dr-x{position:absolute;z-index:3;top:12px;left:12px;width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.92);color:#222;display:grid;place-items:center}
.prof{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:22px;cursor:pointer;width:100%;text-align:right}
.av{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.prof b{display:block;line-height:1.4}.prof small{color:var(--muted)}
.lbl{font-size:12px;color:var(--faint);letter-spacing:.04em;margin:0 8px -6px;font-weight:600}
.mg{padding:8px;display:flex;flex-direction:column;border-radius:26px}
.mi{display:flex;align-items:center;gap:14px;padding:10px;border-radius:18px;width:100%;text-align:right;transition:background .2s}
.mi:hover,.mi:active{background:rgba(255,255,255,calc(var(--ga)*var(--gk)))}
.mi .mc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.28);flex:none}
.mi b{flex:1;font-weight:600}.mi .ch{color:var(--faint)}

/* sheets & modals */
.sh{width:min(100%,540px);max-height:92vh;overflow-y:auto;background:var(--sheet);-webkit-backdrop-filter:blur(36px) saturate(1.6);backdrop-filter:blur(36px) saturate(1.6);border:1px solid var(--gb);border-radius:32px 32px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:sup .4s cubic-bezier(.2,.9,.3,1);position:relative;overscroll-behavior:contain}
.ov.c .sh{border-radius:30px;width:min(100%,440px)}
@keyframes sup{from{transform:translateY(60px);opacity:0}}
.grab{width:44px;height:4px;border-radius:9px;background:var(--seen);margin:0 auto 12px}
.sh h3{margin:0 0 10px;font-size:19px}
.xb{position:absolute;top:14px;left:14px;z-index:4;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.4);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pg{display:grid;grid-template-columns:minmax(0,1fr) 66px;gap:10px;margin-top:22px}
.pg .main{position:relative;aspect-ratio:1/1.02;border-radius:24px;overflow:hidden;cursor:zoom-in;background:var(--bg2)}
.pg .main img{width:100%;height:100%;object-fit:cover;animation:fi .35s}
.pg .main .hn{position:absolute;top:10px;right:10px;font-size:11.5px;padding:3px 12px;border-radius:99px;background:rgba(0,0,0,.42);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pg .main .fv{position:absolute;top:10px;left:10px}
.th{position:relative}.th-in{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}.th-in::-webkit-scrollbar{display:none}
.th button{flex:none;width:66px;height:66px;border-radius:16px;overflow:hidden;border:2px solid transparent;opacity:.7;transition:.25s}

.adm-t{display:flex;align-items:center;gap:10px}.adm-t h2{margin:0;font-size:18px;flex:1;font-family:var(--disp);font-weight:400;font-size:24px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;font-size:13.5px;border:1px solid var(--gb);background:var(--field);white-space:nowrap}

.adm-b{max-width:980px;margin:0 auto;padding:18px max(14px,env(safe-area-inset-left,0px)) 0 max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.ac{padding:18px;display:flex;flex-direction:column;gap:14px}
.ac h3{margin:0;font-size:17px}.ac>p{margin:0;color:var(--muted);font-size:13px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}.fl{font-size:12.5px;color:var(--muted);font-weight:600}.fh{color:var(--faint);font-size:11.5px}
.cp{display:flex;gap:8px;align-items:center}.cp input[type=color]{width:46px;height:44px;border:1px solid var(--gb);border-radius:14px;background:var(--field);padding:3px;flex:none}
.rg{width:100%;accent-color:var(--accent)}
.lst{display:flex;flex-direction:column;gap:12px}
.li{border:1px solid var(--gb);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--field)}
.li-h{display:flex;align-items:center;justify-content:space-between;gap:8px}.li-a{display:flex;gap:6px}
.sb{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--field);border:1px solid var(--gb)}.sb.dg{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:16px;font-weight:700;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on-accent)}

.btn.sec{background:var(--field);color:var(--fg);border:1px solid var(--gb)}.btn.dg{background:rgba(240,116,107,.18);color:var(--bad);border:1px solid rgba(240,116,107,.4)}
.imf{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.imf .pv{width:84px;height:84px;border-radius:18px;background:var(--bg2) center/cover;border:1px solid var(--gb);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--faint)}
.imf .pv img,.imf .pv video{width:100%;height:100%;object-fit:cover}.imf .ct{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}
.up{position:relative;overflow:hidden;display:inline-flex}.up input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

.mini{display:flex;gap:10px;flex-wrap:wrap}.mini .pre{flex:1;min-width:120px;padding:12px;border-radius:18px;border:1px solid var(--gb);background:var(--field);display:flex;flex-direction:column;gap:6px;align-items:center;font-size:13px}.pre i{display:flex}.pre i b{width:22px;height:22px;border-radius:50%;margin-inline-end:-6px;border:2px solid var(--bg)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.stat div{padding:16px;border-radius:20px;background:var(--field);border:1px solid var(--gb)}.stat b{display:block;font-size:24px;color:var(--accent2)}.stat span{font-size:12.5px;color:var(--muted)}
.cmt{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;padding:8px 12px;border-radius:14px;background:var(--bg2)}
.ta{width:100%;min-height:140px;direction:ltr;font-family:ui-monospace,monospace;font-size:12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (min-width:700px){body{padding-top:0}.app{padding-top:90px}}

.logo,.price,.tot .g,.pill,.cl-t span,.nv-b.on,.soc a,.intro .k,.sec-h a,.sec-h button,.links,.night .nt small,.hd .ib b{color:var(--ink)}
.soc a:hover{color:var(--on-accent)}
.sv-a.pr{white-space:nowrap}
:root:not([data-theme="dark"]) .pbtn.ghost{color:var(--fg)}

/* hero-first layout: header floats over the image, stories sit in a glass panel at its foot */
.app.home{padding-top:0}
.hero{height:clamp(540px,150vw,700px);border-radius:0 0 40px 40px;border:0;border-bottom:1px solid var(--gb);margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.hero:not(.has-st){height:clamp(460px,125vw,580px)}
.hero .sl::after{background:linear-gradient(180deg,rgba(10,8,6,.6) 0%,rgba(10,8,6,.05) 26%,rgba(10,8,6,.08) 52%,rgba(10,8,6,.82) 100%)}
.hero .tx{inset:auto;top:calc(104px + env(safe-area-inset-top,0px));right:max(22px,env(safe-area-inset-right,0px));left:auto;width:min(60%,270px)}
.hero:not(.has-st) .tx{top:auto;bottom:64px}
.hero-search{position:absolute;z-index:5;top:calc(104px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));width:48px;height:48px;color:#fff;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-color:rgba(255,255,255,.3)}
.dots{left:max(18px,env(safe-area-inset-left,0px));right:auto;top:calc(172px + env(safe-area-inset-top,0px));bottom:auto;flex-direction:column;align-items:center;width:48px}
.dots i.on{width:7px;height:26px}
.hero-st{position:absolute;z-index:4;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:16px;padding:12px 12px 8px;border-radius:30px;margin:0}
.st-h{display:flex;align-items:center;gap:6px;margin:0 6px 8px;color:var(--ink)}.st-h b{font-size:15px;color:var(--fg)}
.hero-st .stories{padding:2px 2px 8px}
.hero-st .st{flex-basis:68px}.hero-st .ring{width:68px;height:68px}.hero-st .st span{max-width:68px}
.hero-st .hint{padding:2px 4px 2px;background:none;border:0;box-shadow:none;gap:10px}
.hero-st .hint .nb{width:30px;height:30px}
.hd{position:fixed}
.hd-in{transition:background .35s,border-color .35s,box-shadow .35s}
.hd.over .hd-in{background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.hd.over .logo{color:#fff8ea;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.hd.over .logo svg{color:var(--accent2)}
.hd.over .ib{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;border-color:rgba(255,255,255,.3)}
.hd.over .ib b{color:#fff8ea}

/* stories: no card; a fade from the bare hero image into the page colour */
.hero{border-radius:0;border-bottom:0;box-shadow:none}
.hero .sl::after{background:linear-gradient(180deg,rgba(10,8,6,.6) 0%,rgba(10,8,6,.05) 26%,rgba(10,8,6,.04) 100%)}
.hero-st{left:0;right:0;bottom:0;padding:70px max(14px,env(safe-area-inset-right,0px)) 18px max(14px,env(safe-area-inset-left,0px));border:0;border-radius:0;box-shadow:none;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;isolation:isolate}
.hero-st::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none}
.hero-st::after{background:linear-gradient(180deg,transparent 0%,color-mix(in srgb,var(--bg) 22%,transparent) 30%,color-mix(in srgb,var(--bg) 70%,transparent) 55%,color-mix(in srgb,var(--bg) 90%,transparent) 80%,color-mix(in srgb,var(--bg) 93%,transparent) 100%)}
.st-h b{color:#fff8ea;text-shadow:0 1px 10px rgba(0,0,0,.55)}.st-h span{color:var(--accent2)}

/* stories: fade from the bare image into a dark scrim, closed by the hero's rounded bottom edge */
.hero{border-radius:0 0 40px 40px;border-bottom:1px solid var(--gb);box-shadow:var(--shadow)}
.hero-st{padding:70px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px))}
.hero-st::after{background:linear-gradient(180deg,rgba(12,10,8,0) 0%,rgba(12,10,8,.28) 30%,rgba(12,10,8,.62) 55%,rgba(12,10,8,.84) 80%,rgba(12,10,8,.9) 100%)}
.hero-st .st span{color:rgba(255,248,234,.84)}
.hero-st .hint{color:rgba(255,248,234,.74)}
.hero-st .hint .bar{background:rgba(255,255,255,.26)}
.hero-st .hint .nb{background:rgba(255,255,255,.16);color:#fff8ea}
.hero-st .ring img{border-color:#14110d}
.hero-st .ring.seen{background:rgba(255,255,255,.32)}
/* video stories without a poster use a <video> inside the ring: style it like the image */
.ring img,.ring video{display:block}
.ring video{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg);background:var(--bg2);pointer-events:none}
.ring.seen video{filter:grayscale(.55) brightness(.85)}
.hero-st .ring video{border-color:#14110d}

/* bigger logo, size set from the admin (--logo-h) */
:root{--logo-h:52px}
.hd-in{min-height:calc(max(44px,var(--logo-h)) + 16px)}
.logo{font-size:calc(var(--logo-h) * .64);max-width:60%;gap:10px}
.logo img{height:var(--logo-h);max-width:min(230px,100%)}
.logo svg{width:calc(var(--logo-h) * .5);height:calc(var(--logo-h) * .5)}
.app{padding-top:calc(max(44px,var(--logo-h)) + 46px)}
.hero .tx,.hero-search{top:calc(max(44px,var(--logo-h)) + 54px + env(safe-area-inset-top,0px))}
.dots{top:calc(max(44px,var(--logo-h)) + 122px + env(safe-area-inset-top,0px))}

/* ===== fx: reveal, skeleton, lift, badges, countdown, fly ===== */
.rv{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .7s cubic-bezier(.2,.7,.2,1) var(--d,0ms),transform .7s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}
.rv.rvd{opacity:1;transform:none}
.pc.rv.rvd{transition:opacity .7s var(--d,0ms),transform .25s,box-shadow .25s}
.sk::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.35) 50%,transparent 80%) var(--bg2);background-size:200% 100%;animation:shim 1.3s linear infinite}
.sk img{opacity:0}.pc .im img{transition:transform .6s,opacity .5s}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
:root[data-lift="1"] .pc:hover{transform:translateY(-5px);box-shadow:0 16px 34px color-mix(in srgb,var(--accent) 35%,transparent),var(--shadow)}
.pc:active{transform:scale(.97)}
.pc .bd.k-red{background:linear-gradient(90deg,#d64545,#f0735a);color:#fff}
.pc .bd.k-green{background:linear-gradient(90deg,#2f9e6b,#5cc593);color:#fff}
.pc .bd.k-blue{background:linear-gradient(90deg,#4a7fc1,#8fb4d6);color:#fff}
.pc .bd.k-dark{background:#17130f;color:var(--accent2)}
.cd{position:absolute;z-index:2;left:8px;right:8px;bottom:8px;display:flex;align-items:center;justify-content:center;gap:5px;padding:4px 8px;border-radius:99px;background:rgba(14,12,10,.72);color:#fff3da;font-size:12px;direction:rtl;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cd svg{flex:none}.cd b{font-weight:700;font-variant-numeric:tabular-nums}
.cd.big{position:static;display:inline-flex;font-size:13px;background:#d64545;margin-inline-start:6px}
.flyer{position:fixed;z-index:200;border-radius:50%;object-fit:cover;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.4);border:2px solid var(--accent)}
.nv-b.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.rb.add:active{transform:scale(.88)}
.cd{white-space:nowrap}
.cd.sm{position:static;align-self:flex-start;justify-content:flex-start;margin-bottom:6px;padding:3px 10px;font-size:11.5px;background:linear-gradient(90deg,#d64545,#f0735a);color:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
.nv-b .cnt[hidden]{display:none}
.pc .in{background:none;border:0;border-radius:0;width:auto;box-shadow:none;padding:10px 12px 14px}
/* hero crossfade without dip/flash: old slide stays opaque beneath the fading-in one */
.hero .sl{transition:none;z-index:0}
.hero .sl.prev{opacity:1;z-index:1}
.hero .sl.prev img{animation:kb 9s ease-out forwards}
.hero .sl.on{opacity:1;z-index:2;animation:slin .9s ease both}
@keyframes slin{from{opacity:0}to{opacity:1}}
.hero .sl{will-change:opacity}

/* ===== splash ===== */
#splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 30%,#3a2a1a 0%,#17110b 55%,#0b0806 100%);color:#f4dcae;transition:opacity .6s ease,transform .6s ease,visibility .6s}
#splash.out{opacity:0;transform:scale(1.06);visibility:hidden;pointer-events:none}
#splash::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(224,179,116,.28),transparent 65%);animation:spGlow 2.4s ease-in-out infinite alternate}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px}
.sp-mark{position:relative;width:112px;height:112px;display:grid;place-items:center}
.sp-mark svg{width:70px;height:70px;overflow:visible}
.sp-bag,.sp-h{stroke:#e0b374;stroke-width:2.6;stroke-dasharray:200;stroke-dashoffset:200;animation:spDraw 1.3s cubic-bezier(.6,0,.2,1) .15s forwards}
.sp-h{animation-delay:.6s;stroke-dasharray:60;stroke-dashoffset:60}
.sp-bag{fill:rgba(224,179,116,0);animation:spDraw 1.3s cubic-bezier(.6,0,.2,1) .15s forwards,spFill .8s ease 1.1s forwards}
.sp-k{fill:#f4dcae;opacity:0;animation:spPop .5s cubic-bezier(.3,1.8,.5,1) 1.2s forwards}
.sp-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:#e0b374;border-right-color:rgba(224,179,116,.35);animation:spSpin 1.4s linear infinite}
.sp-ring.r2{inset:10px;border-top-color:transparent;border-bottom-color:#f4dcae;border-left-color:rgba(244,220,174,.3);animation-duration:2.1s;animation-direction:reverse}
.sp-logo{max-width:150px;max-height:96px;object-fit:contain;animation:spPop .6s ease both}
.sp-name{font-family:Lalezar,Vazirmatn,system-ui,sans-serif;font-weight:400;font-size:34px;letter-spacing:.5px;background:linear-gradient(100deg,#c79552 20%,#fff1cf 50%,#c79552 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:spShine 2s linear infinite,spUp .7s ease .3s both}
.sp-bar{width:150px;height:4px;border-radius:9px;background:rgba(244,220,174,.15);overflow:hidden;animation:spUp .7s ease .5s both}
.sp-bar i{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,transparent,#e0b374,#fff1cf);animation:spBar 1.1s ease-in-out infinite}
#splash small{font-size:13px;color:rgba(244,220,174,.7);animation:spUp .7s ease .7s both}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spFill{to{fill:rgba(224,179,116,.22)}}
@keyframes spPop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spShine{to{background-position:-250% 0}}
@keyframes spUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spBar{0%{transform:translateX(-120%)}100%{transform:translateX(340%)}}
@keyframes spGlow{from{transform:scale(.85);opacity:.6}to{transform:scale(1.1);opacity:1}}
.skel{display:none}

/* ===== profile ===== */
.hd-av{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.big{width:84px;height:84px;border-radius:26px;font-size:32px}
.pf-av{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.pf-av .up{position:relative;overflow:hidden;cursor:pointer}.pf-av .up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pf-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pf{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.pf-g .pf:nth-child(n+3){grid-column:1/-1}.pf-g .pf:nth-child(n+3):nth-child(odd){}
.pf textarea{resize:none}
.sh{max-height:92vh;overflow-y:auto}
.sync{font-size:12px;color:var(--muted);margin-inline:auto;padding:0 8px;text-align:center}
.sync[data-k=ok]{color:#2f9e6b}.sync[data-k=err]{color:#d64545}.sync[data-k=busy],.sync[data-k=wait]{color:var(--accent2)}
.stat b,.btn.add,.nv-lab{color:var(--ink)}
.sync[data-k=busy],.sync[data-k=wait]{color:var(--ink)}
.sync-row{display:flex;align-items:center;gap:10px}
.sync-row .sync{flex:1;margin:0;text-align:start;padding:0}
.btn.sm{padding:7px 14px;font-size:13px;white-space:nowrap}
.sv-sheet{max-height:80vh;display:flex;flex-direction:column}
.sv-sheet .sh{max-height:inherit;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sv-sheet .cm{max-height:38vh;overflow-y:auto}
.sv-sheet input{font-size:16px}
/* header avatar round */
.ib{position:relative;overflow:hidden;padding:0;flex:none;min-width:44px}
.ib .hd-av{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
/* live comments on story */
.sv-cm{display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-height:150px;overflow:hidden;cursor:pointer}
.sv-cm:empty{display:none}
.sv-cm div{background:rgba(0,0,0,.46);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;padding:6px 12px;border-radius:16px;font-size:13px;line-height:1.7;max-width:88%;word-break:break-word;animation:cmIn .45s both}
.sv-cm b{color:#f4dcae;margin-inline-end:6px}
@keyframes cmIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
