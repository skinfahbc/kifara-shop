<style>html{color-scheme:dark}body{margin:0}
/* Layout: mobile-first RTL storefront, floating glass header + liquid-notch bottom nav over an ambient gold/haze backdrop */
@property --nr{syntax:'<length>';inherits:true;initial-value:0px}
@property --nx{syntax:'<length>';inherits:true;initial-value:50px}
:root{
  --accent:#e0b374; --accent2:#f4dcae; --on-accent:#2a1c08;
  --bgd:#0e0c0a; --bgl:#efe7d9;
  --bg:var(--bgd); --bg2:#1b1712;
  --fg:#f8f0e1; --muted:rgba(248,240,225,.68); --faint:rgba(248,240,225,.4);
  --ga:.12; --gk:1; --blur:22px; --r:24px;
  --gb:rgba(255,255,255,.2); --shadow:0 18px 44px rgba(0,0,0,.42);
  --sheet:rgba(24,20,15,.82); --seen:rgba(255,255,255,.28); --field:rgba(255,255,255,.08);
  --blob1:rgba(224,179,116,.34); --blob2:rgba(111,138,163,.38); --blob3:rgba(160,96,60,.22);
  --ink:var(--accent2);--ok:#6fd3a0; --bad:#f0746b; --font:'Vazirmatn',system-ui,sans-serif; --disp:'Lalezar','Vazirmatn',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--ink:color-mix(in srgb,var(--accent) 50%,#2a1c08);--bg:var(--bgl);--bg2:#e4d9c6;--fg:#2b2217;--muted:rgba(43,34,23,.7);--faint:rgba(43,34,23,.42);--gk:4.2;--gb:rgba(255,255,255,.75);--shadow:0 14px 34px rgba(90,60,20,.16);--sheet:rgba(255,251,244,.86);--seen:rgba(43,34,23,.22);--field:rgba(43,34,23,.06);--blob1:rgba(224,179,116,.5);--blob2:rgba(140,170,200,.5);--blob3:rgba(230,160,130,.3);color-scheme:light}}
:root[data-theme="light"]{--ink:color-mix(in srgb,var(--accent) 50%,#2a1c08);--bg:var(--bgl);--bg2:#e4d9c6;--fg:#2b2217;--muted:rgba(43,34,23,.7);--faint:rgba(43,34,23,.42);--gk:4.2;--gb:rgba(255,255,255,.75);--shadow:0 14px 34px rgba(90,60,20,.16);--sheet:rgba(255,251,244,.86);--seen:rgba(43,34,23,.22);--field:rgba(43,34,23,.06);--blob1:rgba(224,179,116,.5);--blob2:rgba(140,170,200,.5);--blob3:rgba(230,160,130,.3);color-scheme:light}
:root[data-theme="dark"]{--ink:var(--accent2);--bg:var(--bgd);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.75;direction:rtl;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient i{position:absolute;border-radius:50%;filter:blur(70px);animation:drift 26s ease-in-out infinite alternate}
.ambient i:nth-child(1){width:70vmax;height:70vmax;background:var(--blob1);top:-20vmax;right:-18vmax}
.ambient i:nth-child(2){width:60vmax;height:60vmax;background:var(--blob2);top:10vmax;left:-24vmax;animation-delay:-8s}
.ambient i:nth-child(3){width:50vmax;height:50vmax;background:var(--blob3);bottom:-20vmax;right:-10vmax;animation-delay:-15s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}

.glass{background:linear-gradient(145deg,rgba(255,255,255,calc(var(--ga)*var(--gk)*1.5)),rgba(255,255,255,calc(var(--ga)*var(--gk)*.55)));

.hero-st .ring.seen{background:rgba(255,255,255,.32)}
/* video stories without a poster use a <video> inside the ring: style it like the image */
.ring img,.ring video{display:block}
.ring video{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg);background:var(--bg2);pointer-events:none}
.ring.seen video{filter:grayscale(.55) brightness(.85)}
.hero-st .ring video{border-color:#14110d}

/* bigger logo, size set from the admin (--logo-h) */
:root{--logo-h:52px}
.hd-in{min-height:calc(max(44px,var(--logo-h)) + 16px)}
.logo{font-size:calc(var(--logo-h) * .64);max-width:60%;gap:10px}
.logo img{height:var(--logo-h);max-width:min(230px,100%)}
.logo svg{width:calc(var(--logo-h) * .5);height:calc(var(--logo-h) * .5)}
.app{padding-top:calc(max(44px,var(--logo-h)) + 46px)}
.hero .tx,.hero-search{top:calc(max(44px,var(--logo-h)) + 54px + env(safe-area-inset-top,0px))}
.dots{top:calc(max(44px,var(--logo-h)) + 122px + env(safe-area-inset-top,0px))}

/* ===== fx: reveal, skeleton, lift, badges, countdown, fly ===== */
.rv{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .7s cubic-bezier(.2,.7,.2,1) var(--d,0ms),transform .7s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}
.rv.rvd{opacity:1;transform:none}
.pc.rv.rvd{transition:opacity .7s var(--d,0ms),transform .25s,box-shadow .25s}
.sk::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.35) 50%,transparent 80%) var(--bg2);background-size:200% 100%;animation:shim 1.3s linear infinite}
.sk img{opacity:0}.pc .im img{transition:transform .6s,opacity .5s}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
:root[data-lift="1"] .pc:hover{transform:translateY(-5px);box-shadow:0 16px 34px color-mix(in srgb,var(--accent) 35%,transparent),var(--shadow)}
.pc:active{transform:scale(.97)}
.pc .bd.k-red{background:linear-gradient(90deg,#d64545,#f0735a);color:#fff}
.pc .bd.k-green{background:linear-gradient(90deg,#2f9e6b,#5cc593);color:#fff}
.pc .bd.k-blue{background:linear-gradient(90deg,#4a7fc1,#8fb4d6);color:#fff}
.pc .bd.k-dark{background:#17130f;color:var(--accent2)}
.cd{position:absolute;z-index:2;left:8px;right:8px;bottom:8px;display:flex;align-items:center;justify-content:center;gap:5px;padding:4px 8px;border-radius:99px;background:rgba(14,12,10,.72);color:#fff3da;font-size:12px;direction:rtl;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cd svg{flex:none}.cd b{font-weight:700;font-variant-numeric:tabular-nums}
.cd.big{position:static;display:inline-flex;font-size:13px;background:#d64545;margin-inline-start:6px}
.flyer{position:fixed;z-index:200;border-radius:50%;object-fit:cover;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.4);border:2px solid var(--accent)}
.nv-b.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.rb.add:active{transform:scale(.88)}
.cd{white-space:nowrap}
.cd.sm{position:static;align-self:flex-start;justify-content:flex-start;margin-bottom:6px;padding:3px 10px;font-size:11.5px;background:linear-gradient(90deg,#d64545,#f0735a);color:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
.nv-b .cnt[hidden]{display:none}
.pc .in{background:none;border:0;border-radius:0;width:auto;box-shadow:none;padding:10px 12px 14px}
/* hero crossfade without dip/flash: old slide stays opaque beneath the fading-in one */
.hero .sl{transition:none;z-index:0}
.hero .sl.prev{opacity:1;z-index:1}
.hero .sl.prev img{animation:kb 9s ease-out forwards}
.hero .sl.on{opacity:1;z-index:2;animation:slin .9s ease both}
@keyframes slin{from{opacity:0}to{opacity:1}}
.hero .sl{will-change:opacity}

/* fix: stories panel flicker on mobile Chrome (own compositing layer, lighter hero animation, no blur over animated image) */
.hero{isolation:isolate;transform:translateZ(0)}
.hero .sl,.hero .sl img{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.hero .sl.on img,.hero .sl.prev img{animation-name:kb2;will-change:transform}
@keyframes kb2{from{transform:scale(1.02) translateZ(0)}to{transform:scale(1.08) translateZ(0)}}
.hero-st{z-index:6;transform:translateZ(0);will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.hero-search,.hd.over .ib{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(20,16,12,.34)}

/* search button back to the left; comment avatars */
.hero .hero-search{position:absolute;overflow:visible}
.cmi .av{overflow:hidden;padding:0}.cmi .av img{width:100%;height:100%;object-fit:cover;display:block}
.li .av{width:32px;height:32px;border-radius:50%;font-size:13px;overflow:hidden;display:inline-grid;vertical-align:middle;margin-inline-end:6px}.li .av img{width:100%;height:100%;object-fit:cover}

/* public chat room */
.ch{display:flex;flex-direction:column;gap:12px}
.ch-hd{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:24px}
.ch-hd .ci{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on-accent);flex:none}
.ch-hd b{display:block;font-size:16px}.ch-hd small{color:var(--muted);font-size:12.5px}
.ch-list{display:flex;flex-direction:column;gap:10px;min-height:40vh}
.chm{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.chm .av{width:36px;height:36px;border-radius:50%;font-size:14px;overflow:hidden;padding:0}.chm .av img{width:100%;height:100%;object-fit:cover;display:block}
.chm .chb{background:var(--field);border:1px solid var(--gb);padding:8px 12px;border-radius:18px 18px 18px 6px;min-width:90px;max-width:100%}
.chm .chb b{font-size:12.5px;color:var(--accent)}.chm .chb p{margin:2px 0 0;font-size:14.5px;line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap}
.chm .chb small{display:block;color:var(--faint);font-size:10.5px;margin-top:2px}
.chm.me{align-self:flex-end;flex-direction:row-reverse}
.chm.me .chb{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on-accent);border-color:transparent;border-radius:18px 18px 6px 18px}
.chm.me .chb b,.chm.me .chb small{color:inherit;opacity:.8}
.ch-cp{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:8px;align-items:center;padding:8px;border-radius:26px}
.ch-cp .in{border-radius:20px}.ch-cp .btn{flex:none;padding:12px 18px}
.ch-login{width:100%;justify-content:center}

/* chat stickers */
.ch-cp{flex-wrap:wrap}
.ch-sp{flex:0 0 100%;order:-1;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-height:210px;overflow:auto;padding:4px}
.ch-sp[hidden]{display:none}
.ch-sp button{font-size:30px;line-height:1.2;padding:6px 0;border-radius:14px}.ch-sp button:active{background:var(--field)}
.ch-st{flex:none;width:40px;height:40px;font-size:24px;border-radius:50%;display:grid;place-items:center}
.chm.stk .chb,.chm.me.stk .chb{background:none;border:0;padding:0 4px;min-width:0}
.chm.stk .chb p{font-size:64px;line-height:1.15}
.chm.stk .chb b,.chm.stk .chb small,.chm.me.stk .chb b,.chm.me.stk .chb small{color:var(--muted);opacity:1}

/* ===== splash ===== */
#splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 30%,#3a2a1a 0%,#17110b 55%,#0b0806 100%);color:#f4dcae;transition:opacity .6s ease,transform .6s ease,visibility .6s}
#splash.out{opacity:0;transform:scale(1.06);visibility:hidden;pointer-events:none}
#splash::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(224,179,116,.28),transparent 65%);animation:spGlow 2.4s ease-in-out infinite alternate}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px}
.sp-mark{position:relative;width:112px;height:112px;display:grid;place-items:center}
.sp-mark svg{width:70px;height:70px;overflow:visible}
.sp-bag,.sp-h{stroke:#e0b374;stroke-width:2.6;stroke-dasharray:200;stroke-dashoffset:200;animation:spDraw 1.3s cubic-bezier(.6,0,.2,1) .15s forwards}
.sp-h{animation-delay:.6s;stroke-dasharray:60;stroke-dashoffset:60}
.sp-bag{fill:rgba(224,179,116,0);animation:spDraw 1.3s cubic-bezier(.6,0,.2,1) .15s forwards,spFill .8s ease 1.1s forwards}
.sp-k{fill:#f4dcae;opacity:0;animation:spPop .5s cubic-bezier(.3,1.8,.5,1) 1.2s forwards}
.sp-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:#e0b374;border-right-color:rgba(224,179,116,.35);animation:spSpin 1.4s linear infinite}
.sp-ring.r2{inset:10px;border-top-color:transparent;border-bottom-color:#f4dcae;border-left-color:rgba(244,220,174,.3);animation-duration:2.1s;animation-direction:reverse}
.sp-logo{max-width:150px;max-height:96px;object-fit:contain;animation:spPop .6s ease both}
.sp-name{font-family:Lalezar,Vazirmatn,system-ui,sans-serif;font-weight:400;font-size:34px;letter-spacing:.5px;background:linear-gradient(100deg,#c79552 20%,#fff1cf 50%,#c79552 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:spShine 2s linear infinite,spUp .7s ease .3s both}
.sp-bar{width:150px;height:4px;border-radius:9px;background:rgba(244,220,174,.15);overflow:hidden;animation:spUp .7s ease .5s both}
.sp-bar i{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,transparent,#e0b374,#fff1cf);animation:spBar 1.1s ease-in-out infinite}
#splash small{font-size:13px;color:rgba(244,220,174,.7);animation:spUp .7s ease .7s both}
#splash .sp-in{gap:26px}
.sp-mark{width:min(72vw,300px);height:auto;display:block;position:relative}
.sp-mark::before{content:"";position:absolute;inset:-30% -10%;background:radial-gradient(closest-side,rgba(224,179,116,.22),transparent 70%);animation:spGlow 2.4s ease-in-out infinite alternate}
.sp-li{position:relative;display:block;width:100%;height:auto;filter:drop-shadow(0 8px 26px rgba(224,179,116,.35));-webkit-mask-image:linear-gradient(90deg,#000 0,#000 40%,transparent 60%);-webkit-mask-size:300% 100%;-webkit-mask-position:100% 0;mask-image:linear-gradient(90deg,#000 0,#000 40%,transparent 60%);mask-size:300% 100%;mask-position:100% 0;animation:spWipe 1.8s cubic-bezier(.5,0,.2,1) .2s forwards,spFloat 3.2s ease-in-out 2s infinite}
.sp-mark::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,244,214,.55) 50%,transparent 60%);background-size:250% 100%;mix-blend-mode:overlay;-webkit-mask:var(--lg) center/contain no-repeat;mask:var(--lg) center/contain no-repeat;animation:spShine 2.6s linear 1.6s infinite}
@keyframes spWipe{to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes spFloat{50%{transform:translateY(-6px)}}
#splash .sp-bar{width:120px;height:3px}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spFill{to{fill:rgba(224,179,116,.22)}}
@keyframes spPop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spShine{to{background-position:-250% 0}}
@keyframes spUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spBar{0%{transform:translateX(-120%)}100%{transform:translateX(340%)}}
@keyframes spGlow{from{transform:scale(.85);opacity:.6}to{transform:scale(1.1);opacity:1}}
.skel{display:none}

/* ===== profile ===== */
.hd-av{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.big{width:84px;height:84px;border-radius:26px;font-size:32px}
.pf-av{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.pf-av .up{position:relative;overflow:hidden;cursor:pointer}.pf-av .up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pf-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pf{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.pf-g .pf:nth-child(n+3){grid-column:1/-1}.pf-g .pf:nth-child(n+3):nth-child(odd){}
.pf textarea{resize:none}
.sh{max-height:92vh;overflow-y:auto}
.sync{font-size:12px;color:var(--muted);margin-inline:auto;padding:0 8px;text-align:center}
.sync[data-k=ok]{color:#2f9e6b}.sync[data-k=err]{color:#d64545}.sync[data-k=busy],.sync[data-k=wait]{color:var(--accent2)}
.stat b,.btn.add,.nv-lab{color:var(--ink)}
.sync[data-k=busy],.sync[data-k=wait]{color:var(--ink)}
.sync-row{display:flex;align-items:center;gap:10px}
.sync-row .sync{flex:1;margin:0;text-align:start;padding:0}
.btn.sm{padding:7px 14px;font-size:13px;white-space:nowrap}
.sv-sheet{max-height:80vh;display:flex;flex-direction:column}
.sv-sheet .sh{max-height:inherit;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sv-sheet .cm{max-height:38vh;overflow-y:auto}
.sv-sheet input{font-size:16px}
/* header avatar round */
.ib{position:relative;overflow:hidden;padding:0;flex:none;min-width:44px}
.ib .hd-av{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
/* live comments on story */
.sv-cm{display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-height:150px;overflow:hidden;cursor:pointer}
.sv-cm:empty{display:none}
.sv-cm div{background:rgba(0,0,0,.46);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;padding:6px 12px;border-radius:16px;font-size:13px;line-height:1.7;max-width:88%;word-break:break-word;animation:cmIn .45s both}
.sv-cm b{color:#f4dcae;margin-inline-end:6px}
@keyframes cmIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* chat v2: admin badge, images, edit/delete */
.adb{display:inline-block;margin-inline-start:6px;padding:0 8px;border-radius:99px;font-size:10.5px;font-weight:700;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on-accent);vertical-align:middle;line-height:1.8}
.chm.isadm .chb{border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.chm.isadm.stk .chb{border:0;background:none}
.chm .chb img.chi{display:block;max-width:100%;width:240px;max-height:320px;object-fit:cover;border-radius:14px;margin:4px 0;cursor:zoom-in}
.chm .chb .ed{font-size:10.5px;margin-inline-start:4px}
.chm .act{display:flex;gap:14px;margin-top:2px}
.chm .act button{font-size:11.5px;opacity:.85;text-decoration:underline}
.ch-pv{flex:0 0 100%;order:-1;display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:12.5px;color:var(--muted)}
.ch-pv[hidden]{display:none}
.ch-pv span{flex:1}.ch-pv img{width:52px;height:52px;border-radius:12px;object-fit:cover}
.li .chi{max-width:200px;border-radius:12px;display:block}
/* chat layout safety: never let a bubble/image widen the page */
html{overflow-x:hidden;max-width:100%}
.ch,.ch-list,.chm,.chm .chb{min-width:0}
.chm .chb img.chi{width:min(240px,100%);height:auto}
.ch-cp{max-width:100%}.ch-cp .in{flex:1 1 90px}

/* reply (chat + story comments), story comment actions */
.rq{display:block;border-inline-start:3px solid var(--accent);background:color-mix(in srgb,currentColor 9%,transparent);border-radius:8px;padding:3px 8px;margin:3px 0;cursor:pointer;font-size:12px;line-height:1.6;max-width:100%;overflow:hidden;text-align:start}
.rq b,.chm .chb .rq b,.cmi .rq b{display:block;font-size:11.5px;color:var(--accent)}
.rq span,.cmi .rq span{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:inherit}
.chm.me .chb .rq b{color:inherit;opacity:.9}
.chm.flash .chb{outline:2px solid var(--accent);outline-offset:2px}
.cmi .rq{flex:none;background:color-mix(in srgb,var(--fg) 8%,transparent);padding:3px 8px;border-radius:8px;margin:3px 0}
.cmi .act{flex:none;background:none;padding:0;display:flex;gap:14px;margin-top:3px;border-radius:0}
.cmi .act button{font-size:11.5px;opacity:.85;text-decoration:underline;color:var(--muted)}
.cmi.isadm>div{border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--field))}
.cmi.flash>div{outline:2px solid var(--accent)}
.li .rq{cursor:default}

/* coupons + draw banner */
.cpn{padding:12px;border-radius:20px;display:flex;flex-direction:column;gap:8px}
.cpn .cr{display:flex;gap:8px;align-items:center}.cpn .btn{flex:none}
.cpm{font-size:12.5px}.cpm.ok{color:#2fa56b}.cpm.bad{color:#e5484d}.tot .dsc{color:#2fa56b}
#draw-bn{position:fixed;z-index:55;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),520px);border-radius:26px;overflow:hidden;color:var(--fg);
 background:color-mix(in srgb,var(--sheet) 72%,transparent);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);box-shadow:0 16px 44px rgba(0,0,0,.3);animation:bnIn .55s cubic-bezier(.2,.9,.3,1.15) both}
#draw-bn.still{animation:none}
@keyframes bnIn{from{opacity:0;transform:translate(-50%,-34px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.bn-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--gb);font-size:13px;color:var(--muted);font-weight:700}
.bn-h .ico{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on-accent)}
.bn-h .ico img{width:100%;height:100%;object-fit:cover}.bn-h .sp{flex:1}
.bn-x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#e5484d}
.bn-b{padding:12px 16px 4px;display:flex;flex-direction:column;gap:6px}
.bn-t{font-size:16px;font-weight:800}.bn-p{font-size:13.5px;line-height:1.8;color:var(--muted)}.bn-d{font-size:12.5px;color:var(--muted)}
.bn-cd{display:flex;gap:8px;justify-content:center;padding:6px 0 2px}
.bn-cd div{min-width:56px;text-align:center;padding:6px 4px;border-radius:14px;background:var(--field);border:1px solid var(--gb)}
.bn-cd b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.bn-cd small{font-size:10.5px;color:var(--muted)}
.bn-w{display:flex;flex-direction:column;gap:2px;font-size:13.5px;padding:6px 10px;border-radius:14px;background:var(--field)}
.bn-a{display:flex;margin:8px 16px 0;border-top:1px solid var(--gb)}
.bn-a button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 6px;font-size:15px;font-weight:600;color:var(--accent)}
.bn-a button.no{color:#e5484d}.bn-a button[disabled]{opacity:.55}
.bn-a .xc{width:20px;height:20px;border-radius:50%;background:#e5484d;color:#fff;display:grid;place-items:center}

/* stock, shipping, reports */
.pc.so{filter:grayscale(1);opacity:.8}
.pc .sold{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;background:rgba(20,18,16,.8);color:#fff;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.shp{padding:12px;border-radius:20px;display:flex;flex-direction:column;gap:8px}
.sho{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1px solid var(--gb);background:var(--field);text-align:start;width:100%}
.sho .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none}
.sho.on{border-color:var(--accent)}.sho.on .dot{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 45%,transparent 50%)}
.sho .t{flex:1;display:flex;flex-direction:column;min-width:0}.sho .t small{color:var(--muted);font-size:11.5px}.sho .p{font-weight:700;font-size:13px;color:var(--accent2);white-space:nowrap}
.rc{display:flex;align-items:flex-end;gap:3px;height:160px;padding:8px 2px 0;border-bottom:1px solid var(--gb)}
.rc i{flex:1;min-width:4px;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:6px 6px 2px 2px}
.rl{display:flex;gap:3px;padding-top:4px}.rl span{flex:1;text-align:center;font-size:10px;color:var(--muted);min-width:4px;overflow:visible;white-space:nowrap}
.rp{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
.big{font-size:22px;font-weight:800;color:var(--accent2)}

/* ===== desktop layout (>=900px) ===== */
.dots i{cursor:pointer}
@media (min-width:900px){
 body{font-size:16px}
 .app{max-width:1180px;gap:38px;padding-bottom:170px}
 .app.home{padding-top:12px}
 .app:not(.home){max-width:920px}
 .hd{width:min(100%,1180px)}
 .nv{width:min(100%,820px)}
 .app .hero,.app .hero:not(.has-st){height:clamp(540px,68vh,660px);margin-left:0;margin-right:0;border-radius:44px}
 .hero .tx{width:min(48%,460px)}
 .hero h2{font-size:54px}
 .hero p{font-size:16px;max-width:36ch}
 .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
 .app:not(.home) .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 .feat{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
 .cats{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
 .intro{padding:34px 40px}.intro h3{font-size:38px}
 .about{padding:38px}.about p{max-width:60ch}
 .night{max-width:820px;margin-inline:auto}
 .app:not(.home){max-width:1180px}
 .grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
 .app:not(.home) .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
 .pc h4{font-size:15px}
 .sec-h h3{font-size:23px}
 .sim .pc{flex-basis:180px}
 .ch{max-width:780px;margin-inline:auto;width:100%}
 .chm .chb img.chi{width:min(300px,100%)}
 .ov.b{align-items:center;padding:24px}
 .ov.b .sh{border-radius:32px;width:min(100%,720px);max-height:90vh}
 .pg .main{aspect-ratio:1/.85}
 .toast{bottom:130px}
}
@media (min-width:1280px){.app{max-width:1240px}.hd{width:min(100%,1240px)}.grid{gap:24px}}
</style>
